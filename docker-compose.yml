services:
  orchestrator:
    build: .
    ports:
      - "8080:8080"
    environment:
      KANBAN_ORCHESTRATOR_DB: /data/orchestrator.json
    volumes:
      - orchestrator-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  orchestrator-data:
